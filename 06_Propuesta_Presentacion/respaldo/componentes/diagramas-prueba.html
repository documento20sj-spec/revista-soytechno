<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de diagramas</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Gráficos · tokens de tema (claro por defecto; .tema-oscuro redefine) */
.gr{--g-acento:#0057A6;--g-neutro:#5B6472;--g-pista:#E6E9EE;--g-rej:#E3E6EB;--g-txt:#0D0E12;--g-txt2:#5B6472;--g-sup:#FFFFFF;
  margin:0;font-family:"Archivo",system-ui,sans-serif;color:var(--g-txt)}
.tema-oscuro .gr{--g-acento:#1B6BD6;--g-neutro:#7E8796;--g-pista:#1E2430;--g-rej:#232A36;--g-txt:#F4F5F7;--g-txt2:#A9B3C1;--g-sup:#0E0E12}
.gr figcaption{display:flex;flex-direction:column;gap:4px;margin:0 0 16px}
.gr figcaption b{font-weight:700;font-size:18px;line-height:1.3}
.gr figcaption span{font-size:14px;color:var(--g-txt2)}
/* barras horizontales */
.gr-h .gr-cuerpo{display:grid;gap:10px}
.gr-fila{display:grid;grid-template-columns:minmax(150px,34%) 1fr;align-items:center;gap:12px;border-radius:6px;outline:none;padding:2px 0}
.gr-fila:focus-visible{outline:2px solid var(--g-acento);outline-offset:3px}
.gr-et{font-size:14px;line-height:1.3;color:var(--g-txt)}
.gr-pista{position:relative;display:flex;align-items:center;gap:8px;min-height:24px}
.gr-barra{display:block;height:20px;width:calc(var(--v) * (100% - 64px));min-width:2px;background:var(--g-neutro);border-radius:0 4px 4px 0;transform-origin:left center;transition:filter .15s}
.gr-fila.res .gr-barra{background:var(--g-acento)}
.gr-fila:hover .gr-barra,.gr-fila:focus-visible .gr-barra{filter:brightness(1.12)}
.gr-val{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--g-txt);white-space:nowrap}
/* columnas y cascada: un área de trazado común para rejilla, meta y barras */
.gr-ley{display:inline-flex;align-items:center;gap:8px;font-size:13px!important;color:var(--g-txt)!important;margin-top:4px}
.gr-ley i{display:inline-block;width:18px;height:0;border-top:2px solid var(--g-txt)}
.gr-c .gr-cuerpo{position:relative;height:300px;margin:0 0 8px 48px}
.gr-plot{position:absolute;left:0;right:0;top:26px;bottom:44px}
.gr-rej i{position:absolute;left:0;right:0;bottom:calc(var(--y) * 100%);height:1px;background:var(--g-rej)}
.gr-rej i b{position:absolute;right:calc(100% + 8px);top:-7px;white-space:nowrap;font:500 12px/1 "JetBrains Mono",monospace;color:var(--g-txt2);font-variant-numeric:tabular-nums}
.gr-meta{position:absolute;left:0;right:0;bottom:calc(var(--y) * 100%);height:0;border-top:2px solid var(--g-txt);z-index:2}
.gr-cols{position:absolute;inset:0;display:flex;gap:2px}
.gr-col{position:relative;flex:1;outline:none;border-radius:6px}
.gr-col:focus-visible{outline:2px solid var(--g-acento);outline-offset:2px}
.gr-cbar{position:absolute;left:50%;width:24px;margin-left:-12px;bottom:calc(var(--b) * 100%);height:calc(var(--v) * 100%);min-height:2px;
  background:var(--g-acento);border-radius:4px 4px 0 0;transform-origin:50% 100%;transition:filter .15s}
.gr-col:hover .gr-cbar,.gr-col:focus-visible .gr-cbar{filter:brightness(1.12)}
.gr-cval{position:absolute;left:0;right:0;text-align:center;bottom:calc((var(--b) + var(--v)) * 100% + 6px);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--g-txt);z-index:3}
.gr-cet{position:absolute;left:2px;right:2px;top:calc(100% + 8px);text-align:center;font-size:12px;line-height:1.25;color:var(--g-txt2)}
.gr-casc .gr-col.base .gr-cbar{background:var(--g-neutro)}
.gr-casc .gr-col.total .gr-cbar{background:var(--g-txt)}
.gr-casc .gr-col.paso .gr-cbar{border-radius:4px}
/* información emergente */
.gr-tip{position:fixed;z-index:9999;pointer-events:none;background:#0D0E12;color:#fff;border-radius:8px;padding:8px 10px;font:500 13px/1.35 "Archivo",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:280px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.gr-tip.on{opacity:1;transform:none}
.gr-tip strong{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.gr-tip span{color:#C9D2DE}
/* tabla accesible */
.gr-tabla{margin-top:12px;font-size:13px}
.gr-tabla summary{cursor:pointer;color:var(--g-txt2);font-weight:500;min-height:24px}
.gr-tabla table{border-collapse:collapse;width:100%;margin-top:8px}
.gr-tabla caption{text-align:left;font-weight:600;margin-bottom:4px}
.gr-tabla th,.gr-tabla td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--g-rej)}
@media (max-width:600px){.gr-fila{grid-template-columns:1fr}.gr-c .gr-cuerpo{height:240px}.gr-cet{font-size:11px}}
.gr-cval{width:max-content;margin:0 auto;padding:0 3px;background:var(--g-sup);border-radius:3px}
/* Diagramas · comparten los tokens de .gr (graficos.css) */
.dg{--g-acento:#0057A6;--g-neutro:#5B6472;--g-pista:#E6E9EE;--g-rej:#DDE1E7;--g-txt:#0D0E12;--g-txt2:#5B6472;--g-sup:#FFFFFF;--g-banda:#F4F5F7;--g-carbon:#0D0E12;
  margin:0;font-family:"Archivo",system-ui,sans-serif;color:var(--g-txt)}
.tema-oscuro .dg{--g-acento:#1B6BD6;--g-neutro:#7E8796;--g-pista:#1E2430;--g-rej:#2A3240;--g-txt:#F4F5F7;--g-txt2:#A9B3C1;--g-sup:#0E0E12;--g-banda:#141922;--g-carbon:#1B2230}
.dg figcaption{display:flex;flex-direction:column;gap:4px;margin:0 0 16px}
.dg figcaption b{font-weight:700;font-size:18px;line-height:1.3}
.dg figcaption span{font-size:14px;color:var(--g-txt2)}
/* Mapa de paginación */
.mp-ley{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--g-txt)}
.mp-ley li{display:flex;align-items:center;gap:8px}
.mp-ley i{display:inline-block;width:14px;height:18px;border-radius:2px}
.mp-reja{display:grid;grid-template-columns:repeat(9,1fr);gap:12px 10px}
.mp-pl{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.mp-pl.uno:first-child .mp-p{grid-column:2}
.mp-p{aspect-ratio:3/4;border-radius:2px;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;outline:none;min-width:0;transition:transform .15s,filter .15s}
.mp-p b{font:600 12px/1 "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.mp-p i{font:normal 500 12px/1.1 "Archivo",sans-serif;letter-spacing:-.01em;overflow-wrap:anywhere}
.mp-p.edit,.mp-ley i.edit{background:var(--g-sup);box-shadow:inset 0 0 0 1px var(--g-rej)}
.mp-p.portada{background:var(--g-sup);box-shadow:inset 0 0 0 2px var(--g-txt)}
.mp-p.oscuro,.mp-ley i.oscuro{background:var(--g-carbon);color:#F4F5F7}
.mp-p.pauta,.mp-ley i.pauta{background:var(--g-acento);color:#fff}
.mp-p.auto,.mp-ley i.auto{background:repeating-linear-gradient(45deg,var(--g-acento) 0 1.5px,transparent 1.5px 6px),var(--g-sup);box-shadow:inset 0 0 0 1.5px var(--g-acento)}
.mp-p.auto b,.mp-p.auto i{background:var(--g-sup);padding:1px 2px;border-radius:2px;width:max-content}
.mp-p[data-pliego]{cursor:pointer}
.mp-p[data-pliego]:hover,.mp-p:focus-visible{transform:translateY(-3px);filter:brightness(1.06)}
.mp-p:focus-visible{outline:2px solid var(--g-acento);outline-offset:2px}
@media (max-width:900px){.mp-reja{grid-template-columns:repeat(5,1fr)}}
@media (max-width:560px){.mp-reja{grid-template-columns:repeat(3,1fr)}}
/* Ciclo de ocho semanas */
.cg-reja{display:grid;gap:6px}
.cg-cab,.cg-f{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:12px}
.cg-sem{display:grid;grid-template-columns:repeat(8,1fr)}
.cg-s{font:600 12px/1 "JetBrains Mono",monospace;color:var(--g-txt2);padding-left:6px}
.cg-n{font-size:14px;color:var(--g-txt)}
.cg-f.sec .cg-n{color:var(--g-txt2)}
.cg-pista{position:relative;height:28px;background:repeating-linear-gradient(90deg,var(--g-banda) 0 calc(100%/8),transparent calc(100%/8) calc(100%/4));border-radius:3px}
.cg-b{position:absolute;top:4px;bottom:4px;left:calc(var(--a) / 8 * 100% + 3px);width:calc((var(--b) - var(--a)) / 8 * 100% - 6px);background:var(--g-acento);border-radius:4px}
.cg-f.sec .cg-b{background:var(--g-neutro)}
.cg-f.marcas .cg-pista{height:84px;background:repeating-linear-gradient(90deg,var(--g-banda) 0 calc(100%/8),transparent calc(100%/8) calc(100%/4))}
.cg-g{position:absolute;top:8px;left:calc(var(--x) * 100%);transform:translateX(-50%);width:40px;height:30px;border:0;border-radius:6px;background:var(--g-txt);color:var(--g-sup);
  font:700 13px/30px "Archivo",sans-serif;cursor:pointer;padding:0;z-index:2}
.cg-g.doble{top:44px}
.cg-g:hover,.cg-g:focus-visible{background:var(--g-acento);color:#fff;outline:none}
.cg-g:focus-visible{box-shadow:0 0 0 2px var(--g-sup),0 0 0 4px var(--g-acento)}
.cg-dia{position:absolute;top:-232px;bottom:0;left:calc(var(--x) * 100%);width:0;border-left:2px dashed var(--g-acento);z-index:1;pointer-events:none}
.cg-dia span{position:absolute;bottom:-26px;left:-4px;white-space:nowrap;font:700 12px/1 "Archivo",sans-serif;color:var(--g-acento);transform:translateX(-100%)}
.cg-det{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}
.cg-det b{font-size:14px}
.cg-det ol{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--g-txt)}
.cg-det li{padding-left:14px;position:relative}
.cg-det li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--g-acento)}
.cg-ed01{margin:20px 0 0;font:500 13px/1.5 "JetBrains Mono",monospace;color:var(--g-txt2)}
@media (max-width:700px){.cg-cab,.cg-f{grid-template-columns:96px 1fr}.cg-n{font-size:12px}.cg-det{grid-template-columns:1fr}.cg-g{width:32px;font-size:12px}}
/* Hora cero */
.hc-eje{position:relative;list-style:none;margin:24px 0 0;padding:0;height:250px}
.hc-eje::before{content:"";position:absolute;left:0;right:0;top:125px;height:2px;background:var(--g-rej)}
.hc-h{position:absolute;left:calc(var(--x) * 100%);top:125px;width:0;outline:none}
.hc-h::before{content:"";position:absolute;left:-7px;top:-6px;width:14px;height:14px;border-radius:50%;background:var(--g-txt);box-shadow:0 0 0 3px var(--g-sup)}
.hc-h.p2::before{left:-12px;top:-11px;width:24px;height:24px;background:var(--g-acento)}
.hc-h.p1::before{background:var(--g-acento)}
.hc-t{position:absolute;left:-30px;width:60px;text-align:center;font:700 15px/1 "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.hc-a{position:absolute;left:-80px;width:160px;text-align:center;font-size:13px;line-height:1.35;color:var(--g-txt2)}
.hc-h:nth-child(odd) .hc-t{bottom:20px}.hc-h:nth-child(odd) .hc-a{bottom:42px}
.hc-h:nth-child(even) .hc-t{top:22px}.hc-h:nth-child(even) .hc-a{top:44px}
.hc-h.p2 .hc-t{font-size:22px;color:var(--g-acento)}
.hc-h:first-child .hc-t,.hc-h:first-child .hc-a{left:-8px;text-align:left}
.hc-h:last-child .hc-t,.hc-h:last-child .hc-a{left:auto;right:-8px;text-align:right}
.hc-h:focus-visible::before{box-shadow:0 0 0 3px var(--g-sup),0 0 0 5px var(--g-acento)}
@media (max-width:760px){.hc-eje{height:auto;display:grid;gap:14px;padding-left:28px}.hc-eje::before{left:6px;right:auto;top:0;bottom:0;width:2px;height:auto}
  .hc-h{position:relative;left:auto;top:auto;width:auto}.hc-h::before{left:-29px;top:2px}.hc-h.p2::before{left:-34px;top:-3px}
  .hc-t,.hc-a,.hc-h:nth-child(n) .hc-t,.hc-h:nth-child(n) .hc-a{position:static;width:auto;text-align:left;display:block}}
/* Calendario 2027 */
.ca-reja{display:grid;gap:8px}
.ca-meses{position:relative;height:22px;margin-left:84px}
.ca-m{position:absolute;left:calc(var(--x) * 100%);font:500 12px/1 "JetBrains Mono",monospace;color:var(--g-txt2);white-space:nowrap}
.ca-f{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.ca-n{font-size:14px;font-weight:600}
.ca-pista{position:relative;height:30px;border-bottom:1px solid var(--g-rej)}
.ca-pausa{position:absolute;top:0;bottom:0;left:calc(var(--a) * 100%);width:calc((var(--b) - var(--a)) * 100%);background:repeating-linear-gradient(45deg,var(--g-rej) 0 1px,transparent 1px 5px)}
.ca-b{position:absolute;top:9px;height:12px;left:calc(var(--a) * 100%);width:calc((var(--b) - var(--a)) * 100%);background:var(--g-neutro);border-radius:4px;opacity:.55}
.ca-b.gala{background:var(--g-acento);opacity:.75}
.ca-d{position:absolute;left:calc(var(--x) * 100%);top:3px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--g-acento);box-shadow:0 0 0 3px var(--g-sup);outline:none;cursor:default}
.ca-d b{position:absolute;left:30px;top:4px;white-space:nowrap;font:700 13px/1 "JetBrains Mono",monospace;color:var(--g-txt)}
.ca-d:focus-visible{box-shadow:0 0 0 3px var(--g-sup),0 0 0 5px var(--g-acento)}
 body{margin:0;font-family:Archivo} .col{padding:48px;display:grid;gap:72px;max-width:1240px} .tema-oscuro{background:#0E0E12}</style></head>

nfocar con teclado. Texto insertado con textContent. */
(function () {
  const tip = document.createElement('div'); tip.className = 'gr-tip'; tip.setAttribute('role', 'status');
  const fuerte = document.createElement('strong'), et = document.createElement('div'), det = document.createElement('span');
  tip.append(fuerte, et, det); document.addEventListener('DOMContentLoaded', () => document.body.appendChild(tip));
  function mostrar(el, x, y) {
    fuerte.textContent = el.dataset.val || ''; et.textContent = el.dataset.tip || ''; det.textContent = el.dataset.det || '';
    tip.classList.add('on');
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, x + 14)) + 'px';
    tip.style.top = Math.max(8, y - h - 12) + 'px';
  }
  const ocultar = () => tip.classList.remove('on');
  document.addEventListener('pointermove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el.closest('.gr')) mostrar(el, e.clientX, e.clientY); else ocultar();
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('.gr [data-tip]');
    if (el) { const r = el.getBoundingClientRect(); mostrar(el, r.left + r.width / 2, r.top); }
  });
  document.addEventListener('focusout', ocultar);
})();
</script></body></html>
